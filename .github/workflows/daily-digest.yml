name: Daily AI Digest

on:
  schedule:
    - cron: '0 6 * * *'   # 6am UTC = 2am EST / 11pm PST
  workflow_dispatch:        # allow manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: pipeline/package-lock.json

      - name: Install pipeline dependencies
        run: npm install
        working-directory: pipeline

      - name: Generate feed
        run: node generate-feed.js
        working-directory: pipeline
        env:
          POD2TXT_API_KEY: ${{ secrets.POD2TXT_API_KEY }}

      - name: Prepare digest
        run: node prepare-digest.js
        working-directory: pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Commit and push digest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/data/digests/
          git diff --staged --quiet || (git commit -m "digest: $(date +%Y-%m-%d)" && git push)
